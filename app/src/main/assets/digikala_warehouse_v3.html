<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Warehouse</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#111827;--muted:#718096;--line:#e7ebf0;--primary:#2563eb;--ok:#047857;--warn:#b45309;--danger:#b91c1c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh}main{padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:15px;margin-bottom:12px;box-shadow:0 7px 25px rgba(15,23,42,.035)}
.title{font-size:12px;font-weight:800;margin-bottom:10px}.search{display:flex;gap:8px}
input{flex:1;min-width:0;height:48px;border:1px solid #dfe4ea;border-radius:13px;background:#fafbfc;padding:0 13px;direction:ltr;text-align:left;font-size:14px;outline:0}
input:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe}
button{cursor:pointer}.search button{height:48px;border:0;border-radius:13px;background:var(--primary);color:#fff;padding:0 17px;font-weight:800}
.clear{width:46px!important;padding:0!important;background:#fff!important;color:#64748b!important;border:1px solid var(--line)!important}
.status{display:none;padding:10px;border-radius:12px;font-size:10px;font-weight:700;margin-top:10px}.status.show{display:block}
.status.ok{background:#ecfdf5;color:var(--ok);border:1px solid #bbf7d0}.status.error{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}
.recent{display:flex;gap:8px;overflow:auto}.recent button{white-space:nowrap;border:1px solid #e1e5ea;background:#f8fafc;border-radius:11px;padding:9px 11px;font-size:10px;color:#334155}
.product{display:none}.product.active{display:block}.productHead{display:flex;align-items:center;gap:12px}
.photo{width:72px;height:72px;flex:0 0 72px;border-radius:17px;background:#f7f8fa;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:30px}
.photo img{width:100%;height:100%;object-fit:cover}.productName{font-size:15px;font-weight:800;line-height:1.7}.small{font-size:9px;color:var(--muted);margin-top:4px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.infoBox{background:#f7f8fa;border-radius:12px;padding:10px;min-width:0}
.infoBox span{display:block;font-size:8px;color:var(--muted);margin-bottom:5px}.infoBox b{display:block;font-size:11px;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;justify-content:space-between;align-items:center;background:#f7f8fa;padding:11px 12px;border-radius:12px;margin-top:8px}.row span{font-size:9px;color:var(--muted)}.row b{font-size:16px}
.inventory.ok{color:var(--ok)}.inventory.warn{color:var(--warn)}.inventory.danger{color:var(--danger)}
.line{height:1px;background:#edf0f2;margin:16px 0}.center{text-align:center;font-size:10px;font-weight:800}
.quantity{display:flex;justify-content:center;align-items:center;gap:24px;margin:13px 0}.quantity button{width:46px;height:46px;border-radius:13px;border:1px solid #dfe4ea;background:#fff;font-size:24px}
.quantity strong{font-size:25px;min-width:32px;text-align:center}.remaining{text-align:center;color:#707987;font-size:10px}.remaining b{font-size:15px;color:#111827}
.warning{display:none;background:#fff7ed;color:var(--warn);border:1px solid #fed7aa;border-radius:12px;padding:10px;margin-top:10px;text-align:center;font-size:9px;font-weight:800;line-height:1.9}.warning.show{display:block}
.confirm{width:100%;height:50px;border:0;border-radius:14px;margin-top:11px;background:var(--primary);color:#fff;font-weight:800;font-size:12px}.confirm:disabled{background:#cbd5e1;cursor:not-allowed}
.success{display:none;background:#ecfdf5;color:var(--ok);border:1px solid #bbf7d0;border-radius:12px;padding:10px;margin-top:9px;text-align:center;font-size:9px;font-weight:800}.success.show{display:block}
.footer{text-align:center;color:#9ca3af;font-size:8px;margin:18px 0 24px}
@media(max-width:360px){.info{grid-template-columns:1fr}}
@font-face{font-family:"NotoArabic";src:url("NotoSansArabic-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"NotoArabic";src:url("NotoSansArabic-Bold.ttf") format("truetype");font-weight:700 900;font-style:normal;font-display:swap}
html,body,button,input{font-family:"NotoArabic",sans-serif}
body{font-size:14px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
</style>
</head>

<section class="card">
<div class="title">جستجوی کالا با کد تنوع (DKPC)</div>

<button id="confirm" class="confirm">ثبت برداشت</button>
<div id="success" class="success"></div>
</section>
<div class="footer">سیستم عملیات انبار • نسخه آفلاین</div>
</main></div>

const KEY="warehouse_inventory_v3", RECENT="warehouse_recent_v3";
let saved=JSON.parse(localStorage.getItem(KEY)||"null");
const products={};
BANK.forEach(p=>{products[p.k]=Object.assign({},p)});
if(saved){Object.keys(saved).forEach(k=>{if(products[k])products[k].inventory=saved[k]})}
let rec=JSON.parse(localStorage.getItem(RECENT)||"[]").slice(0,3), current=null, currentInventory=0, quantity=1;
const $=id=>document.getElementById(id);
function save(){const x={};Object.values(products).forEach(p=>x[p.k]=Number(p.inventory)||0);localStorage.setItem(KEY,JSON.stringify(x))}
function normalize(x){return x.trim().toUpperCase().replace(/\s+/g,"")}
function status(t,c){$("status").textContent=t;$("status").className="status show "+c}
function recentRender(){const box=$("recent");box.innerHTML="";if(!rec.length){box.innerHTML='<span style="font-size:10px;color:#9aa3af">هنوز جستجویی ثبت نشده</span>';return}rec.forEach(code=>{let b=document.createElement("button");b.textContent=code;b.onclick=()=>load(code);box.appendChild(b)})}
function addRecent(code){const v=normalize(code).replace(/^DKPC[-_]?/,"");rec=[v,...rec.filter(x=>x!==v)].slice(0,3);localStorage.setItem(RECENT,JSON.stringify(rec));recentRender()}
function invClass(v){return v<10?"danger":v<30?"warn":"ok"}
function display(){
$("qty").textContent=quantity;$("remaining").textContent=Math.max(0,currentInventory-quantity);
$("warning").classList.toggle("show",Math.max(0,currentInventory-quantity)<30);
$("confirm").disabled=currentInventory<=0||quantity>currentInventory;
$("success").classList.remove("show")
}
function show(code,p){
current=p;currentInventory=Number(p.inventory)||0;quantity=currentInventory?1:0;
$("name").textContent=p.name||"بدون نام";$("k").textContent=p.k||"—";$("dkp").textContent=p.dkp||"—";$("dkpc").textContent=p.dkpc||"—";$("pcview").textContent=normalizeCode(p.dkpc);
$("shelf").textContent=p.shelf||"—";$("inventory").textContent=currentInventory;$("inventory").className="inventory "+invClass(currentInventory);
const box=$("photo");box.innerHTML="";if(p.photo){const img=document.createElement("img");img.src=p.photo;img.alt=p.name||"product";img.onerror=()=>box.textContent="📦";box.appendChild(img)}else box.textContent="📦";
$("product").classList.add("active");addRecent(code);display()
}
function normalizeCode(x){return String(x??"").trim().toUpperCase().replace(/\s+/g,"").replace(/^DKPC[-:]?/,"")}
function search(){
const input=normalizeCode($("pc").value);
if(!input){status("کد تنوع (DKPC) را وارد کن؛ فقط عدد کافی است.","error");$("product").classList.remove("active");return}
const p=BANK.find(x=>normalizeCode(x.dkpc)===input);
if(!p){status("این کد تنوع در بانک ۲۲۵ کالا پیدا نشد.","error");$("product").classList.remove("active");return}
status("کالا پیدا شد.","ok");show(input,p)
}
function load(code){$("pc").value=code;search()}
$("search").onclick=search;$("pc").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
$("clear").onclick=()=>{$("pc").value="";$("status").className="status";$("product").classList.remove("active");$("pc").focus()};
$("minus").onclick=()=>{quantity=Math.max(1,quantity-1);display()};
$("plus").onclick=()=>{quantity=Math.min(currentInventory,quantity+1);display()};
$("confirm").onclick=()=>{if(!current||quantity<1||quantity>currentInventory)return;const picked=quantity;current.inventory=currentInventory-picked;currentInventory=current.inventory;save();$("inventory").textContent=currentInventory;$("inventory").className="inventory "+invClass(currentInventory);quantity=currentInventory?1:0;display();$("success").textContent="✓ برداشت "+picked+" عدد ثبت شد."; $("success").classList.add("show");status("برداشت با موفقیت ثبت شد.","ok")};
recentRender();
</script></body></html>
