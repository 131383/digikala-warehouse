name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -L --fail -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Generate signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore warehouse-release.keystore \
            -alias warehouse \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass warehouse123 \
            -keypass warehouse123 \
            -dname "CN=Digikala Warehouse, OU=Warehouse, O=Digikala Warehouse, L=Karaj, ST=Alborz, C=IR"

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks warehouse-release.keystore \
            --ks-key-alias warehouse \
            --ks-pass pass:warehouse123 \
            --key-pass pass:warehouse123 \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: digikala-warehouse-release
          path: app/build/outputs/apk/release/app-release.apk